[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluke8588a"
version = "0.1.2"
authors = [{name = "Đorđe Novaković", email = "djordjenovakovic@uns.ac.rs"}]
description = "A Pythonic interface for Fluke 8588A Reference Multimeter using pyvisa"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyvisa-py>=0.5.0"
]

[project.urls]
"Homepage" = "https://github.com/Hepek93/Fluke8588A"

[tool.setuptools]
packages = ["fluke8588a"]